<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Sardine Run</title>
<style>
  @import url('https://fonts.googleapis.com/css2?family=IBM+Plex+Mono:wght@400;500&family=IBM+Plex+Sans+JP:wght@300;400;500&display=swap');
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  :root {
    --bg: #02070c;
    --surface: #07111a;
    --border: #12222e;
    --accent: #56c8e0;
    --accent2: #2f7f93;
    --warm: #ffb36b;
    --text: #d4e6ee;
    --text2: #70909c;
    --text3: #2f4652;
    --font-mono: 'IBM Plex Mono', monospace;
    --font-ui: 'IBM Plex Sans JP', sans-serif;
  }
  body { background: var(--bg); color: var(--text); font-family: var(--font-ui); height: 100vh; display: flex; flex-direction: column; overflow: hidden; user-select: none; }

  header { display: flex; align-items: center; gap: 16px; padding: 10px 20px; border-bottom: 1px solid var(--border); background: var(--surface); flex-shrink: 0; z-index: 10; }
  .back { font-family: var(--font-mono); font-size: 11px; color: var(--text3); text-decoration: none; }
  .back:hover { color: var(--accent); }
  .logo { font-family: var(--font-mono); font-size: 13px; font-weight: 500; color: var(--accent); letter-spacing: 0.08em; text-transform: uppercase; }
  .logo span { color: var(--text3); }
  .badge { font-family: var(--font-mono); font-size: 9px; padding: 2px 6px; border: 1px solid var(--accent2); color: var(--accent); border-radius: 2px; letter-spacing: 0.1em; }
  .stats { margin-left: auto; display: flex; gap: 22px; }
  .stat { display: flex; flex-direction: column; align-items: flex-end; }
  .stat-label { font-family: var(--font-mono); font-size: 9px; color: var(--text3); letter-spacing: 0.1em; }
  .stat-val { font-family: var(--font-mono); font-size: 16px; font-weight: 500; color: var(--text); line-height: 1.2; }

  .main { display: flex; flex: 1; overflow: hidden; }
  .sidebar { width: 250px; flex-shrink: 0; background: var(--surface); border-right: 1px solid var(--border); display: flex; flex-direction: column; overflow-y: auto; z-index: 5; }
  .sidebar::-webkit-scrollbar { width: 4px; }
  .sidebar::-webkit-scrollbar-thumb { background: var(--border); border-radius: 2px; }
  .section { padding: 14px 16px; border-bottom: 1px solid var(--border); }
  .section-title { font-family: var(--font-mono); font-size: 9px; color: var(--text3); letter-spacing: 0.12em; text-transform: uppercase; margin-bottom: 12px; }
  .sub-title { font-family: var(--font-mono); font-size: 10px; color: var(--text2); margin: 4px 0 8px; display: flex; align-items: center; gap: 6px; }
  .sub-title::before { content: ''; width: 6px; height: 6px; border-radius: 50%; background: var(--c, var(--accent)); }

  button { font-family: var(--font-mono); font-size: 11px; font-weight: 500; background: transparent; border: 1px solid var(--border); color: var(--text2); padding: 6px 12px; border-radius: 3px; cursor: pointer; letter-spacing: 0.05em; transition: all 0.15s; white-space: nowrap; }
  button:hover { border-color: var(--accent2); color: var(--accent); background: rgba(86,200,224,0.06); }
  button.active { border-color: var(--accent); color: var(--accent); background: rgba(86,200,224,0.12); }
  button.rec { border-color: #c0392b; color: #ff6b5b; background: rgba(231,76,60,0.12); }
  .play-btn { width: 100%; padding: 8px; font-size: 12px; border-color: var(--accent2); color: var(--accent); letter-spacing: 0.1em; }
  .row { display: flex; gap: 6px; margin-top: 6px; }
  .row button { flex: 1; }
  .grid2 { display: grid; grid-template-columns: 1fr 1fr; gap: 4px; }
  .grid2 button { padding: 6px 4px; font-size: 10px; }
  .grid2 button.wide { grid-column: span 2; }

  .slider-row { margin-bottom: 10px; }
  .slider-header { display: flex; justify-content: space-between; margin-bottom: 5px; }
  .slider-name { font-family: var(--font-mono); font-size: 10px; color: var(--text2); }
  .slider-val { font-family: var(--font-mono); font-size: 10px; color: var(--accent); }
  input[type=range] { -webkit-appearance: none; appearance: none; width: 100%; height: 2px; background: var(--border); border-radius: 1px; outline: none; }
  input[type=range]::-webkit-slider-thumb { -webkit-appearance: none; width: 12px; height: 12px; background: var(--accent); border-radius: 50%; cursor: pointer; }
  input[type=range]::-moz-range-thumb { width: 12px; height: 12px; background: var(--accent); border: none; border-radius: 50%; cursor: pointer; }

  select { width: 100%; font-family: var(--font-mono); font-size: 11px; background: var(--bg); color: var(--text); border: 1px solid var(--border); border-radius: 3px; padding: 5px 6px; outline: none; }
  .field { margin-bottom: 8px; }
  .field label { display: block; font-family: var(--font-mono); font-size: 10px; color: var(--text2); margin-bottom: 4px; }
  .field-pair { display: grid; grid-template-columns: 1fr 1fr; gap: 6px; }
  .check { display: flex; align-items: center; gap: 8px; font-family: var(--font-mono); font-size: 10px; color: var(--text2); margin-bottom: 8px; cursor: pointer; }
  .check input { accent-color: var(--accent); }

  details summary { font-family: var(--font-mono); font-size: 9px; color: var(--text3); letter-spacing: 0.12em; cursor: pointer; list-style: none; }
  details summary::before { content: '▸ '; }
  details[open] summary::before { content: '▾ '; }
  details[open] summary { margin-bottom: 12px; }
  .drop { border: 1px dashed var(--border); border-radius: 4px; padding: 8px; text-align: center; font-family: var(--font-mono); font-size: 10px; color: var(--text2); cursor: pointer; line-height: 1.6; margin-bottom: 8px; }
  .drop:hover, .drop.over { border-color: var(--accent); color: var(--accent); }
  .drop small { color: var(--text3); display: block; font-size: 9px; }
  .model-status { font-family: var(--font-mono); font-size: 9px; color: var(--text3); line-height: 1.6; min-height: 14px; margin-bottom: 8px; word-break: break-all; }
  .model-status.err { color: #e06060; }
  .model-status.busy { color: var(--accent); }
  .model-block + .model-block { margin-top: 14px; padding-top: 12px; border-top: 1px dashed var(--border); }
  .note { font-family: var(--font-mono); font-size: 10px; color: var(--text3); line-height: 1.9; }

  .canvas-wrap { flex: 1; position: relative; overflow: hidden; background: #000; touch-action: none; }
  #c { display: block; width: 100%; height: 100%; }
  .loading { position: absolute; inset: 0; display: flex; align-items: center; justify-content: center; font-family: var(--font-mono); font-size: 12px; color: var(--text3); letter-spacing: 0.1em; }
  .shot { position: absolute; left: 16px; bottom: 14px; font-family: var(--font-mono); font-size: 10px; color: rgba(200,235,245,0.55); letter-spacing: 0.1em; pointer-events: none; text-shadow: 0 0 6px #000; }
  .recdot { position: absolute; right: 16px; top: 14px; font-family: var(--font-mono); font-size: 11px; color: #ff5b4b; display: none; pointer-events: none; text-shadow: 0 0 6px #000; }
  .recdot.on { display: block; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0.3; } }
  .hud { position: absolute; left: 16px; top: 14px; font-family: var(--font-mono); font-size: 11px; color: rgba(210,240,250,0.8); line-height: 1.8; pointer-events: none; text-shadow: 0 0 6px #000; }

  body.clean header, body.clean .sidebar, body.clean .shot, body.clean .hud { display: none; }

  @media (max-width: 700px) {
    header { padding: 8px 12px; gap: 10px; }
    .stats { gap: 10px; }
    .stat-val { font-size: 13px; }
    .badge, .stat.optional { display: none; }
    .main { flex-direction: column-reverse; }
    .sidebar { width: 100%; height: 40vh; border-right: none; border-top: 1px solid var(--border); }
  }
</style>
</head>
<body>

<header>
  <a class="back" href="index.html">←</a>
  <div class="logo">Sardine<span>//</span>Run</div>
  <div class="badge">BAIT BALL</div>
  <div class="stats">
    <div class="stat"><span class="stat-label">イワシ</span><span class="stat-val" id="stFish">0</span></div>
    <div class="stat"><span class="stat-label">イルカ捕食</span><span class="stat-val" id="stDol">0</span></div>
    <div class="stat"><span class="stat-label">カツオドリ捕食</span><span class="stat-val" id="stGan">0</span></div>
    <div class="stat optional"><span class="stat-label">突入</span><span class="stat-val" id="stDive">0</span></div>
    <div class="stat optional"><span class="stat-label">FPS</span><span class="stat-val" id="stFps">—</span></div>
  </div>
</header>

<div class="main">
  <div class="sidebar">

    <div class="section">
      <button class="play-btn" id="btnPlay">❚❚ 一時停止</button>
      <div class="row">
        <button id="btnRec">● 録画</button>
        <button id="btnClean">UIを隠す</button>
      </div>
    </div>

    <div class="section">
      <div class="section-title">カメラ</div>
      <div class="grid2" id="viewBtns">
        <button data-view="cinema" class="active wide">シネマ（自動演出）</button>
        <button data-view="orbit">自由視点</button>
        <button data-view="lowUp">真下から</button>
        <button data-view="dolphinChase">イルカを追跡</button>
        <button data-view="dolphinFP">イルカの目</button>
        <button data-view="gannet">カツオドリ追跡</button>
        <button data-view="inside">イワシの目</button>
      </div>
      <div class="row"><button id="btnNext">次の個体へ ⇥</button></div>
      <div style="margin-top:10px">
        <label class="check"><input type="checkbox" id="chkPilot">イルカを操縦する</label>
      </div>
    </div>

    <div class="section">
      <div class="section-title">イワシの群れ</div>
      <div id="slFish"></div>
    </div>

    <div class="section">
      <div class="section-title">捕食者</div>
      <div class="sub-title" style="--c:#8fa4b4">マイルカ</div>
      <div id="slDol"></div>
      <div class="sub-title" style="--c:#c89a68">カツオドリ</div>
      <div id="slGan"></div>
      <button id="btnDive" style="width:100%">今すぐダイブさせる</button>
    </div>

    <div class="section">
      <div class="section-title">海と光</div>
      <div id="slSea"></div>
      <div class="field"><label>画質</label>
        <select id="quality">
          <option value="high">高（ブルーム・レンズ効果）</option>
          <option value="std">標準（軽量）</option>
        </select>
      </div>
    </div>

    <div class="section">
      <details>
        <summary>3Dモデルの差し替え</summary>
        <div id="modelBlocks"></div>
      </details>
    </div>

    <div class="section note">
      自由視点: ドラッグで回転 / ホイール・ピンチでズーム<br>
      追跡・目線: ドラッグで見回す<br>
      操縦中: マウスの方向へ旋回、押下 / Shift で加速<br>
      Space 一時停止 · Tab 次の個体<br>
      H UIを隠す · R 録画開始/停止<br><br>
      録画は WebM（対応ブラウザでは MP4）で保存されます。UIを隠してから録るときれいです。
    </div>
  </div>

  <div class="canvas-wrap" id="wrap">
    <div class="loading" id="loading">LOADING...</div>
    <canvas id="c"></canvas>
    <div class="hud" id="hud"></div>
    <div class="shot" id="shot"></div>
    <div class="recdot" id="recDot">● REC</div>
  </div>
</div>

<input type="file" id="fileInput" multiple style="display:none" accept=".glb,.gltf,.fbx,.obj,.mtl,.bin,.png,.jpg,.jpeg,.webp,.tga,.bmp">

<script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/libs/fflate.min.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/GLTFLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/DRACOLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/FBXLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/OBJLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/loaders/MTLLoader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/CopyShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/shaders/LuminosityHighPassShader.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/EffectComposer.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/RenderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/ShaderPass.js"></script>
<script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/postprocessing/UnrealBloomPass.js"></script>
<script>
// World scale: 1 unit ≈ 15 cm. Sardine ≈ 20 cm, common dolphin ≈ 2.1 m,
// brown booby wingspan ≈ 1.4 m. The water surface is the plane y = 0.
const V3 = THREE.Vector3;
const MAX_FISH = 6000, MAX_DOL = 8, MAX_GAN = 12;
const HOME = new V3(0, -20, 0);
const TRI_BUDGET = 4e6;

const S = { count: 3000, speed: 0.2, cohesion: 1.1, alignment: 1.6, separation: 1.3, fear: 1.3, radius: 2.6 };
const D = { count: 4, aggression: 1.0, speed: 0.42 };
const G = { count: 5, diveRate: 1.0 };
const SEA = { clarity: 1.0, sunElev: 62, shafts: 1.0, caustics: 1.0 };

function rand(a, b) { return a + Math.random() * (b - a); }
const clamp = (v, a, b) => v < a ? a : v > b ? b : v;

// ─────────────────────────────────────────────
//  SHARED WATER SHADING
// ─────────────────────────────────────────────
const WU = {
  uTime: { value: 0 },
  uSunDir: { value: new V3() },     // toward the sun, in air
  uSunWater: { value: new V3() },   // toward the sun, refracted under water
  uExtinct: { value: new V3() },    // per-channel extinction of the view ray (per unit)
  uAbsorb: { value: new V3() },     // per-channel loss of downwelling light with depth
  uCaustic: { value: 1 },
  uNearCut: { value: 0 },  // first-person views: drop fragments right in front of the lens
};
const BASE_EXTINCT = new V3(0.034, 0.0115, 0.0088);
const BASE_ABSORB = new V3(0.042, 0.011, 0.0065);

const WATER_COMMON = `
uniform float uTime;
uniform vec3 uSunDir;
uniform vec3 uSunWater;
uniform vec3 uExtinct;
uniform vec3 uAbsorb;
uniform float uCaustic;
uniform float uNearCut;
vec3 skyColor(vec3 d) {
  float h = max(d.y, 0.0);
  vec3 c = mix(vec3(0.62, 0.78, 0.92), vec3(0.10, 0.30, 0.70), pow(h, 0.45));
  float s = max(dot(d, uSunDir), 0.0);
  c += vec3(1.0, 0.92, 0.75) * (pow(s, 1200.0) * 60.0 + pow(s, 16.0) * 0.35);
  return c;
}
vec3 waterColor(vec3 d, float y) {
  float up = clamp(d.y * 0.5 + 0.5, 0.0, 1.0);
  vec3 c = mix(vec3(0.0012, 0.010, 0.024), vec3(0.018, 0.150, 0.215), pow(up, 2.4));
  c += vec3(0.020, 0.085, 0.095) * pow(max(dot(d, uSunWater), 0.0), 7.0);
  return c * exp(min(y, 0.0) * 0.016);
}
// "tileable water caustic" (after joltz0r / Dave Hoskins)
float causticAt(vec2 p, float t) {
  vec2 q = mod(p, 6.2831853) - 250.0;
  vec2 i = q; float c = 1.0; float inten = 0.005;
  for (int n = 0; n < 4; n++) {
    float tt = t * (1.0 - (3.5 / float(n + 1)));
    i = q + vec2(cos(tt - i.x) + sin(tt + i.y), sin(tt - i.y) + cos(tt + i.x));
    c += 1.0 / length(vec2(q.x / (sin(i.x + tt) / inten), q.y / (cos(i.y + tt) / inten)));
  }
  c /= 4.0;
  c = 1.17 - pow(c, 1.4);
  return pow(abs(c), 8.0);
}
// length of the camera→p segment that lies under the surface
float underwaterLength(vec3 cam, vec3 p) {
  float dist = length(p - cam);
  if (cam.y >= 0.0 && p.y >= 0.0) return 0.0;
  if (cam.y >= 0.0) return dist * (-p.y) / max(cam.y - p.y, 1e-4);
  if (p.y >= 0.0) return dist * (-cam.y) / max(p.y - cam.y, 1e-4);
  return dist;
}
vec3 applyWater(vec3 col, vec3 p, vec3 faceN) {
  vec3 cam = cameraPosition;
  if (p.y < 0.0) {
    float depth = -p.y;
    col *= exp(-depth * uAbsorb);
    float cs = causticAt(p.xz * 0.11 + vec2(uTime * 0.03, uTime * 0.02), uTime * 0.6);
    col *= 1.0 + cs * uCaustic * max(faceN.y, 0.0) * exp(-depth * 0.035) * 1.6;
  }
  float L = underwaterLength(cam, p);
  vec3 tr = exp(-L * uExtinct);
  vec3 dir = normalize(p - cam);
  return col * tr + waterColor(dir, cam.y < 0.0 ? cam.y : 0.0) * (1.0 - tr);
}
`;

const SURFACE_WAVES = `
uniform vec4 uImp[8];
float surfaceH(vec2 p, out vec2 g, float detail) {
  float h = 0.0; g = vec2(0.0);
  vec4 W[6];
  W[0] = vec4(0.8, 0.6, 34.0, 0.45);
  W[1] = vec4(-0.3, 0.95, 19.0, 0.28);
  W[2] = vec4(0.95, -0.3, 11.0, 0.16);
  W[3] = vec4(-0.7, -0.7, 6.5, 0.09);
  W[4] = vec4(0.2, -0.98, 3.7, 0.05 * detail);
  W[5] = vec4(-0.9, 0.4, 2.3, 0.03 * detail);
  for (int i = 0; i < 6; i++) {
    vec2 d = normalize(W[i].xy);
    float k = 6.2831853 / W[i].z;
    float w = sqrt(65.0 * k);
    float ph = k * dot(d, p) - w * uTime + float(i) * 1.7;
    h += W[i].w * sin(ph);
    g += W[i].w * k * cos(ph) * d;
  }
  for (int i = 0; i < 8; i++) {
    vec4 im = uImp[i];
    float age = uTime - im.z;
    if (age < 0.0 || age > 8.0) continue;
    vec2 dd = p - im.xy;
    float r = length(dd) + 1e-3;
    float front = age * 7.0;
    float env = im.w * exp(-age * 0.6) * exp(-r * 0.05) * smoothstep(front + 2.0, front - 4.0, r);
    float ph = r * 1.1 - age * 9.0;
    h += env * sin(ph);
    g += env * 1.1 * cos(ph) * dd / r;
  }
  return h;
}
`;

function updateSun() {
  const el = SEA.sunElev * Math.PI / 180, az = 0.6;
  const s = new V3(Math.cos(el) * Math.cos(az), Math.sin(el), Math.cos(el) * Math.sin(az));
  WU.uSunDir.value.copy(s);
  // Snell: the sun appears steeper under water
  const sinI = Math.sqrt(1 - s.y * s.y), sinT = sinI / 1.333, cosT = Math.sqrt(1 - sinT * sinT);
  const hx = sinI > 1e-4 ? s.x / sinI : 0, hz = sinI > 1e-4 ? s.z / sinI : 0;
  WU.uSunWater.value.set(hx * sinT, cosT, hz * sinT);
  if (typeof sun !== 'undefined') sun.position.copy(WU.uSunWater.value).multiplyScalar(100);
}
function updateWater() {
  WU.uExtinct.value.copy(BASE_EXTINCT).multiplyScalar(1 / SEA.clarity);
  WU.uAbsorb.value.copy(BASE_ABSORB).multiplyScalar(Math.sqrt(1 / SEA.clarity));
  WU.uCaustic.value = SEA.caustics * (0.4 + 0.6 * Math.sin(SEA.sunElev * Math.PI / 180));
}

// ─────────────────────────────────────────────
//  RENDERER / SCENE
// ─────────────────────────────────────────────
const canvas = document.getElementById('c');
const wrap = document.getElementById('wrap');
const renderer = new THREE.WebGLRenderer({ canvas, antialias: true });
renderer.setPixelRatio(Math.min(window.devicePixelRatio, 1.5));
renderer.outputEncoding = THREE.sRGBEncoding;
renderer.toneMapping = THREE.ACESFilmicToneMapping;
renderer.toneMappingExposure = 1.1;

const scene = new THREE.Scene();
const camera = new THREE.PerspectiveCamera(60, 1, 0.1, 2400);

const hemi = new THREE.HemisphereLight(0x9fdfff, 0x1d4656, 1.0);   // ground = upwelling light
scene.add(hemi);
const sun = new THREE.DirectionalLight(0xe6f8ff, 1.35);
scene.add(sun);
updateSun(); updateWater();

// sky dome / open-water background (follows the camera)
const domeMat = new THREE.ShaderMaterial({
  side: THREE.BackSide, depthWrite: false,
  uniforms: WU,
  vertexShader: `varying vec3 vDir; void main() { vDir = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position, 1.0); }`,
  fragmentShader: WATER_COMMON + `
    varying vec3 vDir;
    void main() {
      vec3 d = normalize(vDir);
      vec3 col;
      if (cameraPosition.y < 0.0) {
        float sw = sqrt(max(0.0, 1.0 - d.y * d.y)), sa = sw * 1.333;
        if (d.y > 0.0 && sa < 1.0) {           // inside Snell's window: the refracted sky
          vec2 h = sw > 1e-4 ? d.xz / sw : vec2(1.0, 0.0);
          col = skyColor(vec3(h.x * sa, sqrt(1.0 - sa * sa), h.y * sa));
          vec3 tr = exp(-(-cameraPosition.y / d.y) * uExtinct);
          col = col * tr + waterColor(d, cameraPosition.y) * (1.0 - tr);
        } else col = waterColor(d, cameraPosition.y);
      } else {

  bVel[i*3] = vx; bVel[i*3+1] = vy; bVel[i*3+2] = vz;

}

    bPos[ix+2] += (bVel[ix+2] + Math.cos(t * 5 + bSeed[i]) * s * 0.03) * dt;

// ─────────────────────────────────────────────
//  PROCEDURAL ANIMALS
//  Built along +Z (head forward) with +Y up, textured from small canvases.
// ─────────────────────────────────────────────
class GeoBuilder {
  constructor() { this.p = []; this.uv = []; this.idx = []; }
  v(x, y, z, u, w) { this.p.push(x, y, z); this.uv.push(u, w); return this.p.length / 3 - 1; }
  tri(a, b, c) { this.idx.push(a, b, c); }
  build() {
    const g = new THREE.BufferGeometry();
    g.setAttribute('position', new THREE.Float32BufferAttribute(this.p, 3));
    g.setAttribute('uv', new THREE.Float32BufferAttribute(this.uv, 2));
    g.setIndex(this.idx);
    g.computeVertexNormals();
    return g;
  }
}
// smooth interpolation through control points (Catmull-Rom in value, piecewise in t)
function curve(ts, vs) {
  return t => {
    t = clamp(t, 0, 1);
    let i = 0;
    while (i < ts.length - 2 && t > ts[i + 1]) i++;
    const u = (t - ts[i]) / (ts[i + 1] - ts[i]);
    const p0 = vs[Math.max(0, i - 1)], p1 = vs[i], p2 = vs[i + 1], p3 = vs[Math.min(vs.length - 1, i + 2)];
    const u2 = u * u, u3 = u2 * u;
    return 0.5 * (2 * p1 + (-p0 + p2) * u + (2 * p0 - 5 * p1 + 4 * p2 - p3) * u2 + (-p0 + 3 * p1 - 3 * p2 + p3) * u3);
  };
}
// body of revolution with elliptical rings; u = t along body, v = angle around (0 top)
function tube(b, len, rings, segs, H, W, Y, uv) {
  const base = b.p.length / 3;

    const t = i / rings, z = len * (0.5 - t), h = Math.max(0, H(t)), w = Math.max(0, W(t)), yc = Y(t);
    for (let j = 0; j <= segs; j++) {
      const a = j / segs * Math.PI * 2;
      const [u, vv] = uv(t, j / segs);
      b.v(Math.sin(a) * w * 0.5, yc + Math.cos(a) * h * 0.5, z, u, vv);
    }
  }
  for (let i = 0; i < rings; i++) for (let j = 0; j < segs; j++) {
    const a = base + i * (segs + 1) + j, c = a + segs + 1;
    b.tri(a, a + 1, c); b.tri(a + 1, c + 1, c);
  }
}
// flat polygon (triangle fan)
function fan(b, pts, uvs, flip = false) {
  const ids = pts.map((p, k) => b.v(p[0], p[1], p[2], uvs[k][0], uvs[k][1]));
  for (let k = 1; k < ids.length - 1; k++) flip ? b.tri(ids[0], ids[k + 1], ids[k]) : b.tri(ids[0], ids[k], ids[k + 1]);
}

function canvasTex(w, h, paint) {
  const cv = document.createElement('canvas');
  cv.width = w; cv.height = h;
  const ctx = cv.getContext('2d');
  const img = ctx.createImageData(w, h);
  for (let y = 0; y < h; y++) for (let x = 0; x < w; x++) {
    const c = paint((x + 0.5) / w, (y + 0.5) / h);
    const k = (y * w + x) * 4;
    img.data[k] = clamp(c[0], 0, 255); img.data[k+1] = clamp(c[1], 0, 255); img.data[k+2] = clamp(c[2], 0, 255); img.data[k+3] = 255;
  }
  ctx.putImageData(img, 0, 0);

  t.flipY = false;

  t.anisotropy = 4;

}
const mix3 = (a, b, t) => [a[0] + (b[0] - a[0]) * t, a[1] + (b[1] - a[1]) * t, a[2] + (b[2] - a[2]) * t];

// マイワシ: dark blue-green back, silver flanks, a row of black spots
function makeSardine() {
  const H = curve([0, .03, .1, .25, .45, .65, .8, .9, 1], [0, .07, .15, .205, .19, .13, .075, .05, .06]);
  const W = t => H(t) * (0.55 + 0.12 * (1 - sstep(0, 0.15, t)));
  const Y = t => -0.008 * Math.sin(Math.PI * t);
  const b = new GeoBuilder();

  const z = t => 0.5 - t, top = t => Y(t) + H(t) / 2, bot = t => Y(t) - H(t) / 2;
  const finUV = [0.97, 0.06];
  fan(b, [[0, 0.028, -0.5], [0, 0.15, -0.71], [0, 0, -0.6], [0, -0.15, -0.71], [0, -0.028, -0.5]], Array(5).fill(finUV));
  fan(b, [[0, top(.38) - 0.005, z(.38)], [0, top(.42) + 0.075, z(.45)], [0, top(.55) - 0.005, z(.55)]], Array(3).fill(finUV));
  fan(b, [[0, bot(.68) + 0.004, z(.68)], [0, bot(.72) - 0.03, z(.74)], [0, bot(.8) + 0.004, z(.8)]], Array(3).fill(finUV));
  for (const s of [-1, 1]) fan(b, [[s * W(.18) * 0.45, Y(.18) - H(.18) * 0.28, z(.18)], [s * (W(.18) * 0.5 + 0.05), Y(.2) - H(.2) * 0.42, z(.27)], [s * W(.22) * 0.45, Y(.22) - H(.22) * 0.33, z(.23)]], Array(3).fill([0.3, 0.5]));
  const geo = b.build();

  const back = [16, 42, 58], silver = [178, 192, 200], belly = [236, 241, 243];
  const map = canvasTex(512, 128, (u, v) => {
    const vt = Math.min(v, 1 - v) * 2;     // 0 dorsal ridge → 1 belly
    let c = mix3(back, silver, sstep(0.27, 0.42, vt));
    c = mix3(c, belly, sstep(0.62, 0.92, vt));
    c = mix3(c, [70, 120, 140], Math.exp(-(((vt - 0.33) / 0.03) ** 2)) * 0.35);   // iridescent band
    if (u > 0.1 && u < 0.18) c = mix3(c, [205, 190, 160], 0.25 * sstep(0.3, 0.5, vt)); // gill cover
    const sc = 0.94 + 0.06 * Math.sin(u * 420) * Math.sin(v * 150);
    c = c.map(x => x * sc);
    for (let k = 0; k < 8; k++) {             // lateral spots
      const cu = 0.24 + k * 0.062 + (k % 2) * 0.004;
      for (const cv of [0.2, 0.8]) if (ell(u, v, cu, cv, 0.011, 0.022) < 1) c = [24, 30, 36];
    }
    for (const cv of [0.18, 0.82]) {         // eye
      const e = ell(u, v, 0.065, cv, 0.018, 0.05);
      if (e < 1) c = e < 0.45 ? [8, 8, 10] : [215, 220, 210];
    }

    return c;

  return new THREE.Mesh(geo, mat);
}

// マイルカ (common dolphin): dark cape, tan hourglass patch in front, grey behind, white belly

// カツオドリ (brown booby): chocolate head, back and wings, white belly, pale bill
function makeBooby() {

  const K = 8, up = [], dn = [];
  for (let k = 0; k <= K; k++) {
    const s = k / K, x = 0.04 + s * 0.46;
    const lead = 0.04 + 0.025 * Math.sin(Math.PI * s * 0.8) - s * s * 0.12;

    const ids = up.map(w => [

      b.v(side * w.x, w.y + off, w.trail, w.s, vBase + 0.24),

  const tl = [[-0.035, 0.012, -0.21], [0.035, 0.012, -0.21], [0.0, 0.006, -0.36]];
  fan(b, tl, Array(3).fill([0.95, 0.6]), false);
  fan(b, tl.map(p => [p[0], p[1] - 0.004, p[2]]), Array(3).fill([0.95, 0.85]), true);
  const geo = b.build();

  const brown = [62, 42, 28], white = [236, 234, 228], bill = [222, 210, 150];
  const map = canvasTex(512, 256, (u, v) => {
    if (v < 0.5) {                                   // body: u = t (bill → tail), v = angle

      const bellyEdge = 0.42;

      for (const cv of [0.21, 0.79]) if (ell(u, a, 0.19, cv, 0.008, 0.035) < 1) c = [230, 220, 170];
      return c.map(x => x * (0.92 + 0.08 * Math.sin(u * 300 + a * 40)));
    }

      const chord = (v - 0.505) / 0.24;
      return brown.map(x => x * (0.85 + 0.15 * Math.sin(u * 90) * sstep(0.5, 1, chord) + 0.08 * chord));
    }
    const chord = (v - 0.755) / 0.24;                // underwing: white centre, brown margins
    const inner = sstep(0.12, 0.25, chord) * (1 - sstep(0.62, 0.75, chord)) * (1 - sstep(0.55, 0.7, u));

}

//  MODEL PIPELINE (vertex animation textures + procedural motion)

const VAT_HEADER = `
uniform sampler2D vatPos;
uniform sampler2D vatNor;
uniform vec3 vatDim;
uniform mat3 uOrient;
uniform float uSize;
uniform float uMotion;        // 0 none/baked, 1 wings (flap+fold), 2 lateral swim, 3 vertical fluke
uniform float uAmp;
uniform vec2 uHalf;
attribute float vIdx;
attribute float aPhase;
attribute float aFold;
attribute float aAmp;
varying vec3 vWPos;
vec2 vatUV(float f) {
  float x = mod(vIdx, vatDim.x);

  return vec2((x + 0.5) / vatDim.x, (row + 0.5) / (vatDim.y * vatDim.z));
}
vec3 vatRead(sampler2D tex) {

`;

#ifdef USE_TANGENT
  vec3 objectTangent = vec3( tangent.xyz );
#endif
`;
const VAT_POSITION = `
vec3 transformed = uOrient * vatRead(vatPos);
{

    float ax = abs(transformed.x), sx = sign(transformed.x);

    transformed.x = sx * (min(ax, s) + ex * (1.0 - 0.84 * f));
    transformed.z -= ex * 0.85 * f;
    transformed.y += ex * 0.06 * f;
    float span = ex / max(uHalf.x - s, 1e-3);

    float tz = clamp((uHalf.y - transformed.z) / (2.0 * uHalf.y), 0.0, 1.0);
    transformed.x += sin(ph - tz * 5.0) * uAmp * aAmp * (0.12 + tz * tz);

`;
const WORLDPOS = `
#include <project_vertex>
{

// ─────────────────────────────────────────────
//  SARDINES
// ─────────────────────────────────────────────
const pos = new Float32Array(MAX_FISH * 3), vel = new Float32Array(MAX_FISH * 3), nvel = new Float32Array(MAX_FISH * 3);
const bank = new Float32Array(MAX_FISH * 3), panic = new Float32Array(MAX_FISH), phase = new Float32Array(MAX_FISH);
const stats = { dolphin: 0, gannet: 0, dives: 0 };

function spawnFish(i) {
  const r = Math.cbrt(Math.random()) * 14;
  const th = rand(0, Math.PI * 2), ph = Math.acos(rand(-1, 1));
  pos[i*3] = HOME.x + r * Math.sin(ph) * Math.cos(th);
  pos[i*3+1] = HOME.y + r * Math.cos(ph) * 0.6;
  pos[i*3+2] = HOME.z + r * Math.sin(ph) * Math.sin(th);
  const a = rand(-0.3, 0.3);
  vel[i*3] = Math.cos(a) * S.speed; vel[i*3+1] = 0; vel[i*3+2] = Math.sin(a) * S.speed;
  bank[i*3] = bank[i*3+1] = bank[i*3+2] = 0;

}
// an eaten sardine is replaced by a newcomer arriving from beyond visibility
function respawnFar(i) {
  const a = rand(0, Math.PI * 2), r = rand(130, 160);
  pos[i*3] = core.x + Math.cos(a) * r; pos[i*3+1] = clamp(core.y + rand(-10, 10), -60, -3); pos[i*3+2] = core.z + Math.sin(a) * r;
  vel[i*3] = -Math.cos(a) * S.speed; vel[i*3+1] = 0; vel[i*3+2] = -Math.sin(a) * S.speed;
  panic[i] = 0;
}

// spatial hash (counting sort into buckets)
const HASH = 1 << 15;
const cellStart = new Int32Array(HASH + 1), cellCount = new Int32Array(HASH);
const cellOf = new Int32Array(MAX_FISH), sorted = new Int32Array(MAX_FISH);
let cs = S.radius;
const hcell = (x, y, z) => ((x * 73856093) ^ (y * 19349663) ^ (z * 83492791)) & (HASH - 1);
function buildGrid(n) {
  cs = S.radius;
  cellCount.fill(0);
  for (let i = 0; i < n; i++) {
    const c = hcell(Math.floor(pos[i*3] / cs), Math.floor(pos[i*3+1] / cs), Math.floor(pos[i*3+2] / cs));
    cellOf[i] = c; cellCount[c]++;
  }
  let acc = 0;
  for (let c = 0; c < HASH; c++) { cellStart[c] = acc; acc += cellCount[c]; }
  cellStart[HASH] = acc;
  cellCount.fill(0);
  for (let i = 0; i < n; i++) { const c = cellOf[i]; sorted[cellStart[c] + cellCount[c]++] = i; }
}
// nearest sardine within r of (x,y,z); -1 if none
function nearestFish(x, y, z, r) {
  const r2 = r * r, k = Math.ceil(r / cs);
  const gx = Math.floor(x / cs), gy = Math.floor(y / cs), gz = Math.floor(z / cs);
  let best = -1, bd = r2;
  for (let dx = -k; dx <= k; dx++) for (let dy = -k; dy <= k; dy++) for (let dz = -k; dz <= k; dz++) {
    const c = hcell(gx + dx, gy + dy, gz + dz);
    for (let s = cellStart[c], e = cellStart[c+1]; s < e; s++) {
      const j = sorted[s];
      const ox = pos[j*3] - x, oy = pos[j*3+1] - y, oz = pos[j*3+2] - z;
      const d2 = ox*ox + oy*oy + oz*oz;
      if (d2 < bd) { bd = d2; best = j; }
    }
  }
  return best;
}
function panicAround(x, y, z, r, amount) {
  const r2 = r * r;
  for (let i = 0; i < S.count; i++) {
    const ox = pos[i*3] - x, oy = pos[i*3+1] - y, oz = pos[i*3+2] - z;
    const d2 = ox*ox + oy*oy + oz*oz;
    if (d2 < r2) {
      const d = Math.sqrt(d2) + 1e-3, w = (1 - d / r);
      panic[i] = Math.min(1, panic[i] + amount * w);
      const kick = w * S.speed * 2.5;
      vel[i*3] += ox / d * kick; vel[i*3+1] += oy / d * kick; vel[i*3+2] += oz / d * kick;
    }
  }
}

// the main ball: centroid of the dense core, ignoring stragglers and newcomers
const core = HOME.clone(), coreVel = new V3();
let ballR = 12;
function updateCore() {
  const n = S.count, rc = Math.max(22, ballR * 2.4), rc2 = rc * rc;
  let sx = 0, sy = 0, sz = 0, sd = 0, c = 0, vx = 0, vy = 0, vz = 0;
  for (let i = 0; i < n; i++) {
    const ox = pos[i*3] - core.x, oy = pos[i*3+1] - core.y, oz = pos[i*3+2] - core.z;
    const d2 = ox*ox + oy*oy + oz*oz;
    if (d2 < rc2) { sx += pos[i*3]; sy += pos[i*3+1]; sz += pos[i*3+2]; sd += d2; c++; vx += vel[i*3]; vy += vel[i*3+1]; vz += vel[i*3+2]; }
  }
  if (c < n * 0.1) {
    sx = sy = sz = 0;
    for (let i = 0; i < n; i++) { sx += pos[i*3]; sy += pos[i*3+1]; sz += pos[i*3+2]; }
    core.lerp(new V3(sx / n, sy / n, sz / n), 0.2);
    return;
  }
  core.lerp(new V3(sx / c, sy / c, sz / c), 0.15);
  coreVel.set(vx / c, vy / c, vz / c);
  ballR += (Math.sqrt(sd / c) * 1.2 - ballR) * 0.05;
}

const MAX_NEIGHBORS = 28;
function stepFish(dt) {
  const n = S.count;
  buildGrid(n);
  const R = S.radius, R2 = R * R, sepR2 = (R * 0.42) ** 2;
  const maxS = S.speed, minS = maxS * 0.5, k = maxS / 0.75;
  const maxF = 0.03 * k;
  const bankK = Math.min(1, 0.08 * dt);
  const fearD = 14, fearD2 = fearD * fearD, fearG = 11, fearG2 = fearG * fearG;
  const nD = D.count, nG = G.count;

  for (let i = 0; i < n; i++) {
    const ix = i*3;
    const px = pos[ix], py = pos[ix+1], pz = pos[ix+2];
    const vx = vel[ix], vy = vel[ix+1], vz = vel[ix+2];
    let sx = 0, sy = 0, sz = 0, ax = 0, ay = 0, az = 0, cx = 0, cy = 0, cz = 0, pn = 0, cnt = 0;
    const gx = Math.floor(px / cs), gy = Math.floor(py / cs), gz = Math.floor(pz / cs);
    search:
    for (let dx = -1; dx <= 1; dx++) for (let dy = -1; dy <= 1; dy++) for (let dz = -1; dz <= 1; dz++) {
      const c = hcell(gx + dx, gy + dy, gz + dz);
      for (let s = cellStart[c], e = cellStart[c+1]; s < e; s++) {
        const j = sorted[s];
        if (j === i) continue;
        const jx = j*3;
        const ox = px - pos[jx], oy = py - pos[jx+1], oz = pz - pos[jx+2];
        const d2 = ox*ox + oy*oy + oz*oz;
        if (d2 > R2) continue;
        if (d2 < sepR2 && d2 > 1e-6) { sx += ox / d2; sy += oy / d2; sz += oz / d2; }
        ax += vel[jx]; ay += vel[jx+1]; az += vel[jx+2];
        cx += pos[jx]; cy += pos[jx+1]; cz += pos[jx+2];
        pn += panic[j];
        if (++cnt >= MAX_NEIGHBORS) break search;
      }
    }
    // alarm spreads through the school as a wave
    if (cnt > 0) { const avgP = pn / cnt; if (avgP > panic[i]) panic[i] += (avgP - panic[i]) * Math.min(1, 0.09 * dt); }
    const pi = panic[i];

    let fx = 0, fy = 0, fz = 0;
    if (cnt > 0) {
      const inv = 1 / cnt;
      fx += (ax * inv - vx) * 0.05 * S.alignment;
      fy += (ay * inv - vy) * 0.05 * S.alignment;
      fz += (az * inv - vz) * 0.05 * S.alignment;
      const kc = 0.0035 * k * S.cohesion * (1 + 2.2 * pi);   // under threat the school tightens into a ball
      fx += (cx * inv - px) * kc; fy += (cy * inv - py) * kc; fz += (cz * inv - pz) * kc;
    }
    const ks = 0.05 * k * S.separation * (1 - 0.35 * pi);
    fx += sx * ks; fy += sy * ks; fz += sz * ks;

    // stay in the arena, below the surface, above the deep
    const hx = px - HOME.x, hz = pz - HOME.z, rh = Math.sqrt(hx*hx + hz*hz);
    if (rh > 70) { const g = (rh - 70) * 0.0004 * k / rh; fx -= hx * g; fz -= hz * g; }
    if (py > -2.5) fy -= (py + 2.5) * 0.006 * k;
    if (py < -70) fy += (-70 - py) * 0.001 * k;
    fy += (HOME.y - py) * 0.00004 * k;

    let fear = 0;
    for (let d = 0; d < nD; d++) {
      const o = dolphins[d].p;
      const ox = px - o.x, oy = py - o.y, oz = pz - o.z, d2 = ox*ox + oy*oy + oz*oz;
      if (d2 < fearD2) {
        const dd = Math.sqrt(d2) + 1e-4, w = (1 - dd / fearD) * 0.1 * k * S.fear;
        fx += ox / dd * w; fy += oy / dd * w; fz += oz / dd * w; fear += 1 - dd / fearD;
      }
    }
    for (let g = 0; g < nG; g++) {
      const b = gannets[g];
      if (b.p.y > 6 || b.state === 'surface' || b.state === 'fly' || b.state === 'takeoff') continue;
      const o = b.p, ox = px - o.x, oy = py - o.y, oz = pz - o.z, d2 = ox*ox + oy*oy + oz*oz;
      if (d2 < fearG2) {
        const dd = Math.sqrt(d2) + 1e-4, w = (1 - dd / fearG) * 0.14 * k * S.fear;
        fx += ox / dd * w; fy += oy / dd * w; fz += oz / dd * w; fear += 1.3 * (1 - dd / fearG);
      }
    }
    if (fear > 0) panic[i] = Math.min(1, panic[i] + fear * 0.15 * S.fear * dt);

    const lim = maxF * (1 + pi * 2.5);
    const fl = Math.sqrt(fx*fx + fy*fy + fz*fz);
    if (fl > lim) { const s = lim / fl; fx *= s; fy *= s; fz *= s; }
    let nx = vx + fx * dt, ny = vy + fy * dt, nz = vz + fz * dt;
    ny *= 0.99;
    const sp = Math.sqrt(nx*nx + ny*ny + nz*nz) + 1e-6;
    const top = maxS * (1 + pi * 1.6);
    const ts = sp > top ? top : (sp < minS ? minS : sp);
    nx *= ts / sp; ny *= ts / sp; nz *= ts / sp;
    nvel[ix] = nx; nvel[ix+1] = ny; nvel[ix+2] = nz;
    const li = 1 / (maxF + 1e-6);
    bank[ix] += ((nx - vx) * li - bank[ix]) * bankK;
    bank[ix+1] += ((ny - vy) * li - bank[ix+1]) * bankK;
    bank[ix+2] += ((nz - vz) * li - bank[ix+2]) * bankK;
  }

  const decay = Math.pow(0.988, dt);
  for (let i = 0; i < n; i++) {
    const ix = i*3;
    vel[ix] = nvel[ix]; vel[ix+1] = nvel[ix+1]; vel[ix+2] = nvel[ix+2];
    pos[ix] += vel[ix] * dt; pos[ix+1] += vel[ix+1] * dt; pos[ix+2] += vel[ix+2] * dt;
    if (pos[ix+1] > -0.4) { pos[ix+1] = -0.4; if (vel[ix+1] > 0) vel[ix+1] = 0; }
    const sp = Math.hypot(vel[ix], vel[ix+1], vel[ix+2]) / S.speed;
    const hz = models.fish && models.fish.anim ? models.fish.cycle * (0.6 + 0.5 * sp) : 3 + 6 * sp;   // tail beats
    phase[i] = (phase[i] + hz * dt / 60) % 1;

}

// ─────────────────────────────────────────────
//  STEERING HELPERS
// ─────────────────────────────────────────────
const _d = new V3(), _t = new V3(), _u = new V3();
function steer(o, desired, spd, maxTurn, accel, dt) {
  let s = o.v.length();
  if (s < 1e-5) { o.v.copy(desired).multiplyScalar(0.01); s = 0.01; }
  _d.copy(o.v).divideScalar(s);
  const ang = Math.acos(clamp(_d.dot(desired), -1, 1));
  if (ang > 1e-4) _d.lerp(desired, Math.min(1, maxTurn * dt / ang)).normalize();
  s += clamp(spd - s, -accel * dt, accel * dt);
  o.v.copy(_d).multiplyScalar(s);
}
function trackBank(o, prev, scale, dt) {
  _t.copy(o.v).sub(prev).multiplyScalar(scale / Math.max(dt, 1e-3));
  o.bank.lerp(_t, Math.min(1, 0.07 * dt));
  if (o.bank.lengthSq() > 0.49) o.bank.setLength(0.7);   // never roll past ~35°
  if (o.v.x * o.v.x + o.v.z * o.v.z > 1e-4) o.head.set(o.v.x, 0, o.v.z).normalize();
}

// ─────────────────────────────────────────────
//  DOLPHINS: herd the school toward the surface, then strike
// ─────────────────────────────────────────────
const dolphins = [];
for (let i = 0; i < MAX_DOL; i++) {
  const a = i / MAX_DOL * Math.PI * 2;
  dolphins.push({
    p: new V3(HOME.x + Math.cos(a) * 35, HOME.y - 10, HOME.z + Math.sin(a) * 35), v: new V3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(0.3),
    bank: new V3(), head: new V3(1, 0, 0), phase: Math.random(), amp: 1,
    state: 'herd', t: rand(100, 500), ang: a, sign: i % 2 ? 1 : -1, yOff: rand(-1, 1), breath: rand(900, 3000), target: -1,
  });
}
const pilot = { x: 0, y: 0, boost: false };
const _prev = new V3();
function stepDolphins(dt) {
  const n = D.count;
  for (let k = 0; k < n; k++) {
    const d = dolphins[k];
    _prev.copy(d.v);
    const size = models.dolphin ? models.dolphin.size : 14;
    if (opts.pilot && k === view.idx && (view.mode === 'dolphinChase' || view.mode === 'dolphinFP')) {
      const dir = _d.copy(d.v).normalize();
      const right = _t.set(-dir.z, 0, dir.x).normalize();
      const up = _u.crossVectors(right, dir);
      const des = new V3().copy(dir).addScaledVector(right, pilot.x * 0.9).addScaledVector(up, -pilot.y * 0.9).normalize();
      if (d.p.distanceTo(HOME) > 150) des.addScaledVector(_t.copy(HOME).sub(d.p).normalize(), 0.2).normalize();
      steer(d, des, pilot.boost ? 1.0 : D.speed * 1.1, 0.05, 0.03, dt);
    } else if (d.state === 'herd') {
      // circle the ball just outside it, mostly below, which drives the sardines upward
      const R = ballR + 9;

      _t.set(core.x + Math.cos(d.ang) * R, core.y - ballR * 0.55 - 3 + d.yOff * 5, core.z + Math.sin(d.ang) * R);
      const des = _t.sub(d.p);
      for (let m = 0; m < n; m++) {
        if (m === k) continue;
        _u.copy(d.p).sub(dolphins[m].p);
        const l = _u.length();
        if (l < 10) des.addScaledVector(_u, (10 - l) / l * 2);
      }
      des.normalize();
      steer(d, des, D.speed, 0.035, 0.01, dt);
      d.t -= dt * D.aggression;
      d.breath -= dt;
      if (d.t < 0 && S.count > 0) {
        // strike at the nearest of a few random sardines
        let best = -1, bd = Infinity;
        for (let s = 0; s < 60; s++) {
          const j = (Math.random() * S.count) | 0;
          const dd = (pos[j*3] - d.p.x) ** 2 + (pos[j*3+1] - d.p.y) ** 2 + (pos[j*3+2] - d.p.z) ** 2;
          if (dd < bd && (pos[j*3] - core.x) ** 2 + (pos[j*3+1] - core.y) ** 2 + (pos[j*3+2] - core.z) ** 2 < (ballR * 1.5) ** 2) { bd = dd; best = j; }
        }

      const j = d.target, jx = j * 3;

      if (_t.length() > 80) d.t = 0;
      steer(d, _t.normalize(), D.speed * 2.3, 0.07, 0.035, dt);
      d.t -= dt;

    } else if (d.state === 'breathe') {
      _t.set(d.v.x, 0, d.v.z).normalize().multiplyScalar(0.6).add(_u.set(0, 1, 0)).normalize();
      steer(d, _t, D.speed * 1.2, 0.03, 0.015, dt);
      if (d.p.y > -1.6) {
        const bh = _u.copy(d.p).addScaledVector(d.v.clone().normalize(), size * 0.25);
        for (let b = 0; b < 40; b++) emitBubble(bh.x + rand(-0.4, 0.4), bh.y + rand(-0.3, 0.3), bh.z + rand(-0.4, 0.4), rand(-0.05, 0.05), rand(0, 0.08), rand(-0.05, 0.05), rand(0.05, 0.3), 200);
        d.v.y = -Math.abs(d.v.y) - 0.1;
        d.state = 'herd'; d.breath = rand(1800, 3600);
      }
    }
    d.p.addScaledVector(d.v, dt);
    if (d.p.y > -0.9) { d.p.y = -0.9; if (d.v.y > 0) d.v.y *= 0.3; }
    trackBank(d, _prev, 16, dt);
    const sp = d.v.length();

    const hz = models.dolphin && models.dolphin.anim ? models.dolphin.cycle : 1.0 + 2.2 * sp / (D.speed * 2.3);
    d.phase = (d.phase + hz * dt / 60) % 1;

    // catch with the rostrum

      const head = _t.copy(d.v).normalize().multiplyScalar(size * 0.48).add(d.p);
      const j = nearestFish(head.x, head.y, head.z, 1.6);
      if (j >= 0) {
        respawnFar(j);
        stats.dolphin++;
        panicAround(head.x, head.y, head.z, 7, 0.8);
        if (d.state === 'attack') { d.state = 'herd'; d.t = rand(200, 500); }
      }
    }
  }
}

// ─────────────────────────────────────────────
//  BROWN BOOBIES: circle above, plunge-dive, pursue, bob up and take off
// ─────────────────────────────────────────────
const gannets = [];
for (let i = 0; i < MAX_GAN; i++) {
  const a = rand(0, Math.PI * 2);
  gannets.push({
    p: new V3(HOME.x + Math.cos(a) * 40, rand(40, 60), HOME.z + Math.sin(a) * 40), v: new V3(-Math.sin(a), 0, Math.cos(a)).multiplyScalar(0.6),
    bank: new V3(), head: new V3(1, 0, 0), phase: Math.random(), fold: 0, amp: 1,
    state: 'fly', t: rand(240, 900), st: 0, ang: a, R: rand(25, 50), alt: rand(42, 62), sign: Math.random() < 0.5 ? 1 : -1, flapT: rand(0, 200), aim: new V3(),

const gravity = 0.02;
let pendingDive = false;
function startDive(g) {
  // aim at one of the sardines near the top of the ball

  const x = (e.clientX - r.left) / r.width * 2 - 1, y = (e.clientY - r.top) / r.height * 2 - 1;
  const dz = v => Math.abs(v) < 0.06 ? 0 : Math.sign(v) * Math.min(1, (Math.abs(v) - 0.06) / 0.7);
  pilot.x = dz(x); pilot.y = dz(y);
}
canvas.addEventListener('pointerdown', e => {
  canvas.setPointerCapture(e.pointerId);
  pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
  dragMoved = 0; dragging = true;
  if (piloting()) { pilot.boost = e.pointerType === 'mouse'; pilotFrom(e); }
  if (pointers.size === 2) { const [a, b] = [...pointers.values()]; pinchDist = Math.hypot(a.x - b.x, a.y - b.y); }
});
canvas.addEventListener('pointermove', e => {
  if (piloting() && (e.pointerType === 'mouse' || pointers.has(e.pointerId))) pilotFrom(e);
  const p = pointers.get(e.pointerId);
  if (!p) return;
  const dx = e.clientX - p.x, dy = e.clientY - p.y;
  p.x = e.clientX; p.y = e.clientY;
  if (pointers.size === 1) {
    dragMoved += Math.abs(dx) + Math.abs(dy);
    if (view.mode === 'orbit') {
      orbit.theta -= dx * 0.006;
      orbit.phi = clamp(orbit.phi - dy * 0.006, 0.15, Math.PI - 0.05);
    } else if (!piloting()) {
      view.yaw = clamp(view.yaw - dx * 0.005, -2.6, 2.6);
      view.pitch = clamp(view.pitch - dy * 0.005, -1.2, 1.2);
    }
  } else if (pointers.size === 2 && view.mode === 'orbit') {
    const [a, b] = [...pointers.values()];
    const d = Math.hypot(a.x - b.x, a.y - b.y);
    if (pinchDist > 0) orbit.dist = clamp(orbit.dist * pinchDist / d, 8, 220);
    pinchDist = d;
  }
});
function endPointer(e) {
  pointers.delete(e.pointerId);
  if (!pointers.size) { dragging = false; pilot.boost = false; if (e.pointerType !== 'mouse') pilot.x = pilot.y = 0; }
  pinchDist = 0;
}
canvas.addEventListener('pointerup', endPointer);
canvas.addEventListener('pointercancel', endPointer);
canvas.addEventListener('pointerleave', e => { if (e.pointerType === 'mouse') pilot.x = pilot.y = 0; });
canvas.addEventListener('wheel', e => {
  e.preventDefault();
  if (view.mode === 'orbit') orbit.dist = clamp(orbit.dist * Math.exp(e.deltaY * 0.001), 8, 220);
}, { passive: false });
window.addEventListener('keydown', e => {
  if (e.target.tagName === 'INPUT' || e.target.tagName === 'SELECT') return;
  if (e.code === 'Space') { e.preventDefault(); togglePlay(); }
  else if (e.code === 'Tab') { e.preventDefault(); nextTarget(); }
  else if (e.key === 'h' || e.key === 'H') toggleClean();
  else if (e.key === 'r' || e.key === 'R') toggleRec();
  else if (e.key === 'Shift') pilot.boost = true;
});
window.addEventListener('keyup', e => { if (e.key === 'Shift') pilot.boost = false; });

// ─────────────────────────────────────────────
//  UI
// ─────────────────────────────────────────────
const shotEl = document.getElementById('shot'), hudEl = document.getElementById('hud');
const sliderEls = {};
function addSlider(target, obj, objName, key, name, min, max, step, fmt, onChange) {
  const row = document.createElement('div');
  row.className = 'slider-row';
  row.innerHTML = `<div class="slider-header"><span class="slider-name">${name}</span><span class="slider-val"></span></div><input type="range" min="${min}" max="${max}" step="${step}">`;
  const input = row.querySelector('input'), out = row.querySelector('.slider-val');
  input.value = obj[key]; out.textContent = fmt(obj[key]);
  input.addEventListener('input', () => { obj[key] = +input.value; out.textContent = fmt(obj[key]); onChange && onChange(); });
  sliderEls[objName + '.' + key] = { input, out, fmt };
  document.getElementById(target).appendChild(row);
}
function setParam(obj, key, v) {
  obj[key] = v;
  const name = obj === S ? 'S' : obj === D ? 'D' : obj === G ? 'G' : 'SEA';
  const el = sliderEls[name + '.' + key];
  if (el) { el.input.value = v; el.out.textContent = el.fmt(v); }
}
const f2 = v => v.toFixed(2), f1 = v => v.toFixed(1), fi = v => String(v);
addSlider('slFish', S, 'S', 'count', 'イワシの数', 300, MAX_FISH, 100, fi, () => { for (let i = 0; i < MAX_FISH; i++) if (i >= S.count) spawnFish(i); });
addSlider('slFish', S, 'S', 'speed', '泳ぐ速さ', 0.1, 0.4, 0.01, f2);
addSlider('slFish', S, 'S', 'cohesion', '結束（集まる力）', 0, 3, 0.05, f2);
addSlider('slFish', S, 'S', 'alignment', '整列（向きを揃える）', 0, 3, 0.05, f2);
addSlider('slFish', S, 'S', 'separation', '分離（ぶつからない）', 0, 3, 0.05, f2);
addSlider('slFish', S, 'S', 'fear', '恐怖の強さ', 0, 3, 0.05, f2);
addSlider('slDol', D, 'D', 'count', '頭数', 0, MAX_DOL, 1, fi);
addSlider('slDol', D, 'D', 'aggression', '攻撃の頻度', 0.2, 3, 0.1, f1);
addSlider('slDol', D, 'D', 'speed', '巡航速度', 0.25, 0.7, 0.01, f2);
addSlider('slGan', G, 'G', 'count', '羽数', 0, MAX_GAN, 1, fi);
addSlider('slGan', G, 'G', 'diveRate', 'ダイブの頻度', 0.2, 3, 0.1, f1);
addSlider('slSea', SEA, 'SEA', 'clarity', '透明度', 0.4, 2.5, 0.05, f2, updateWater);
addSlider('slSea', SEA, 'SEA', 'sunElev', '太陽の高さ（°）', 15, 88, 1, fi, () => { updateSun(); updateWater(); });
addSlider('slSea', SEA, 'SEA', 'shafts', '光の筋', 0, 2, 0.05, f2, () => shaftMat.uniforms.uShaft.value = SEA.shafts);
addSlider('slSea', SEA, 'SEA', 'caustics', 'コースティクス', 0, 2, 0.05, f2, updateWater);

// model replacement blocks
const statusEls = {}, slotUI = {};
const fileInput = document.getElementById('fileInput');
let fileTarget = 'fish';
fileInput.addEventListener('change', () => { if (fileInput.files.length) loadFiles(fileTarget, fileInput.files); fileInput.value = ''; });
function setStatus(slot, html, cls = '') { statusEls[slot].innerHTML = html; statusEls[slot].className = 'model-status ' + cls; }
for (const slot in SLOT_DEF) {
  const def = SLOT_DEF[slot], st = slotState[slot];
  const blk = document.createElement('div');
  blk.className = 'model-block';
  blk.innerHTML = `
    <div class="sub-title" style="--c:${def.color}">${def.name}</div>
    <div class="row" style="margin:0 0 8px"><button class="builtin">内蔵モデルに戻す</button></div>
    <div class="drop">ファイルを選択 / ドロップ<small>glb · gltf · fbx · obj（+テクスチャ・mtl）</small></div>
    <div class="field-pair">
      <div class="field"><label>前方向</label><select class="fwd">${Object.keys(AXES).map(a => `<option>${a}</option>`).join('')}</select></div>
      <div class="field"><label>上方向</label><select class="up">${Object.keys(AXES).map(a => `<option>${a}</option>`).join('')}</select></div>
    </div>
    <div class="field"><label>動き</label><select class="motion">
      <option value="anim">モデル内蔵アニメーション</option>
      <option value="swim">泳ぎ（左右・魚）</option>
      <option value="fluke">泳ぎ（上下・イルカ）</option>
      <option value="flap">羽ばたき・翼をたたむ（鳥）</option>
      <option value="none">なし</option>
    </select></div>
    <div class="field clipField" style="display:none"><label>アニメーション</label><select class="clip"></select></div>
    <div class="slider-row"><div class="slider-header"><span class="slider-name">大きさ</span><span class="slider-val sizeOut"></span></div>
      <input type="range" class="size" min="${def.size * 0.3}" max="${def.size * 3}" step="${def.size / 50}"></div>
    <div class="model-status"></div>`;
  document.getElementById('modelBlocks').appendChild(blk);
  const q = s => blk.querySelector(s);
  statusEls[slot] = q('.model-status');
  const ui = slotUI[slot] = { fwd: q('.fwd'), up: q('.up'), motion: q('.motion'), clip: q('.clip'), clipField: q('.clipField'), size: q('.size'), sizeOut: q('.sizeOut') };
  q('.builtin').addEventListener('click', () => useBuiltin(slot));
  const drop = q('.drop');
  drop.addEventListener('click', () => { fileTarget = slot; fileInput.click(); });
  drop.addEventListener('dragover', e => { e.preventDefault(); drop.classList.add('over'); });
  drop.addEventListener('dragleave', () => drop.classList.remove('over'));
  drop.addEventListener('drop', e => { e.preventDefault(); drop.classList.remove('over'); loadFiles(slot, e.dataTransfer.files); });
  const reorient = () => {
    st.fwd = ui.fwd.value; st.up = ui.up.value;
    const m = models[slot]; if (!m) return;
    m.uniforms.uOrient.value.copy(orientMatrix(st.fwd, st.up));
    updateHalfExtents(m.mesh.geometry, m.uniforms);
  };
  ui.fwd.addEventListener('change', reorient);
  ui.up.addEventListener('change', reorient);
  ui.motion.addEventListener('change', () => { st.motion = ui.motion.value; if (st.root) rebuild(slot); syncSlotUI(slot); });
  ui.clip.addEventListener('change', () => { st.clipIdx = +ui.clip.value; if (st.root) rebuild(slot); });
  ui.size.addEventListener('input', () => {
    st.size = +ui.size.value; ui.sizeOut.textContent = st.size.toFixed(1);
    const m = models[slot]; if (m) { m.uniforms.uSize.value = st.size; m.size = st.size; }
  });
}
function syncSlotUI(slot) {
  const st = slotState[slot], ui = slotUI[slot];
  ui.fwd.value = st.fwd; ui.up.value = st.up;
  ui.motion.querySelector('[value=anim]').disabled = !st.clips.length;
  ui.motion.value = st.motion;
  ui.clipField.style.display = st.clips.length > 1 && st.motion === 'anim' ? '' : 'none';
  ui.clip.innerHTML = st.clips.map((c, i) => `<option value="${i}">${c.name || 'clip ' + i}</option>`).join('');
  ui.clip.value = st.clipIdx;
  ui.size.value = st.size; ui.sizeOut.textContent = st.size.toFixed(1);
}

let running = true;
const btnPlay = document.getElementById('btnPlay');
function togglePlay() { running = !running; btnPlay.textContent = running ? '❚❚ 一時停止' : '▶ 再開'; }
btnPlay.addEventListener('click', togglePlay);
function toggleClean() { document.body.classList.toggle('clean'); resize(); }
document.getElementById('btnClean').addEventListener('click', toggleClean);
document.querySelectorAll('#viewBtns button').forEach(b => b.addEventListener('click', () => setView(b.dataset.view)));
document.getElementById('btnNext').addEventListener('click', nextTarget);
document.getElementById('chkPilot').addEventListener('change', e => {
  opts.pilot = e.target.checked; pilot.x = pilot.y = 0;
  if (opts.pilot && view.mode !== 'dolphinChase' && view.mode !== 'dolphinFP') setView('dolphinChase');
});
document.getElementById('btnDive').addEventListener('click', () => {
  if (G.count === 0) setParam(G, 'count', 1);
  pendingDive = true;
});
document.getElementById('quality').addEventListener('change', e => setQuality(e.target.value));

// recording
let recorder = null, recChunks = [];
const btnRec = document.getElementById('btnRec'), recDot = document.getElementById('recDot');
function toggleRec() {
  if (recorder) { recorder.stop(); return; }
  if (!window.MediaRecorder || !canvas.captureStream) { alert('このブラウザは録画に対応していません'); return; }
  const types = ['video/mp4;codecs=avc1', 'video/webm;codecs=vp9', 'video/webm;codecs=vp8', 'video/webm'];
  const mime = types.find(t => MediaRecorder.isTypeSupported(t)) || '';
  recorder = new MediaRecorder(canvas.captureStream(60), mime ? { mimeType: mime, videoBitsPerSecond: 16e6 } : {});
  recChunks = [];
  recorder.ondataavailable = e => { if (e.data.size) recChunks.push(e.data); };
  recorder.onstop = () => {
    const type = recorder.mimeType || mime || 'video/webm';
    const blob = new Blob(recChunks, { type });
    const a = document.createElement('a');
    const d = new Date(), pad = x => String(x).padStart(2, '0');
    a.href = URL.createObjectURL(blob);
    a.download = `sardine_run_${d.getFullYear()}${pad(d.getMonth() + 1)}${pad(d.getDate())}-${pad(d.getHours())}${pad(d.getMinutes())}${pad(d.getSeconds())}.${type.includes('mp4') ? 'mp4' : 'webm'}`;
    a.click();
    setTimeout(() => URL.revokeObjectURL(a.href), 10000);
    recorder = null;
    btnRec.textContent = '● 録画'; btnRec.classList.remove('rec'); recDot.classList.remove('on');
  };
  recorder.start(500);
  btnRec.textContent = '■ 停止'; btnRec.classList.add('rec'); recDot.classList.add('on');
}
btnRec.addEventListener('click', toggleRec);

function resize() {
  const w = wrap.clientWidth, h = wrap.clientHeight;
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
  const db = renderer.getDrawingBufferSize(new THREE.Vector2());
  const scale = db.y / (2 * Math.tan(camera.fov * Math.PI / 360));
  bubbleMat.uniforms.uScale.value = scale; snowMat.uniforms.uScale.value = scale;
  if (composer) {
    composer.setSize(w, h);
    composer.setPixelRatio && composer.setPixelRatio(renderer.getPixelRatio());
    gradePass.uniforms.uRes.value.set(db.x, db.y);
  }
}
window.addEventListener('resize', resize);

// ─────────────────────────────────────────────
//  LOOP
// ─────────────────────────────────────────────
const stFish = document.getElementById('stFish'), stDol = document.getElementById('stDol'), stGan = document.getElementById('stGan');
const stDive = document.getElementById('stDive'), stFps = document.getElementById('stFps');
let last = performance.now(), fpsAcc = 0, fpsFrames = 0, uiTimer = 0;
function frame(now) {
  requestAnimationFrame(frame);
  const ms = Math.min(50, now - last);
  last = now;
  const dt = ms / 16.667;
  if (running) {
    WU.uTime.value += ms / 1000;
    updateCore();
    stepFish(dt);
    stepDolphins(dt);
    stepGannets(dt);
    stepBubbles(dt);
  }
  if (!dragging) { view.yaw *= Math.pow(0.92, dt); view.pitch *= Math.pow(0.92, dt); }
  updateCamera(dt);
  syncMeshes();
  if (composer && quality === 'high') {
    gradePass.uniforms.uTime.value = WU.uTime.value;
    gradePass.uniforms.uUnder.value = camera.position.y < 0 ? 1 : 0;
    composer.render();
  } else renderer.render(scene, camera);

  fpsAcc += ms; fpsFrames++; uiTimer += ms;
  if (uiTimer > 300) {
    stFish.textContent = S.count; stDol.textContent = stats.dolphin; stGan.textContent = stats.gannet; stDive.textContent = stats.dives;
    stFps.textContent = Math.round(1000 * fpsFrames / fpsAcc);
    hudEl.textContent = piloting() ? 'イルカを操縦中 · マウスの方向へ旋回 · 押下 / Shift で加速' : '';
    fpsAcc = 0; fpsFrames = 0; uiTimer = 0;
  }
}

for (let i = 0; i < MAX_FISH; i++) spawnFish(i);
for (const slot in SLOT_DEF) useBuiltin(slot);
const mobile = matchMedia('(max-width: 700px)').matches;
if (mobile) { document.getElementById('quality').value = 'std'; setParam(S, 'count', 1500); }
setQuality(mobile ? 'std' : 'high');
setView('cinema');
document.getElementById('loading').remove();
requestAnimationFrame(frame);
</script>
